<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allen Gillon — homepage options</title>
<style>
  :root{
    --bar: #1c2532;
    --bar-2:#243040;
    --line:#3a4658;
    --txt:#eef2f7;
    --dim:#aab6c6;
    --accent:#e0b64a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#0f1520;color:var(--txt);
    display:flex;flex-direction:column;height:100dvh;
  }

  /* top bar */
  .bar{background:var(--bar);border-bottom:1px solid var(--line);flex:0 0 auto;}
  .bar-top{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:12px 18px;
  }
  .title{font-size:1.02rem;font-weight:700;letter-spacing:.2px;}
  .title span{color:var(--dim);font-weight:400;}
  .hint{font-size:.82rem;color:var(--dim);}

  .bar-nav{
    display:flex;align-items:center;gap:8px;
    padding:0 12px 12px;flex-wrap:wrap;
  }
  .step{
    background:transparent;color:var(--txt);border:1px solid var(--line);
    border-radius:8px;cursor:pointer;font-size:.95rem;font-weight:600;
    min-height:46px;padding:8px 14px;display:inline-flex;align-items:center;gap:9px;
  }
  .step:hover{background:var(--bar-2);}
  .step[aria-current="true"]{background:var(--accent);color:#20180a;border-color:var(--accent);}
  .step .n{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);
    font-size:.8rem;font-weight:700;
  }
  .step[aria-current="true"] .n{background:rgba(0,0,0,.18);}

  .arrows{margin-left:auto;display:flex;gap:8px;}
  .arrow{
    background:var(--bar-2);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;cursor:pointer;min-height:46px;min-width:46px;font-size:1.1rem;
  }
  .arrow:hover{background:#31405633;border-color:var(--accent);}
  .arrow:disabled{opacity:.35;cursor:default;}

  /* frame */
  .stage{flex:1 1 auto;position:relative;background:#fff;}
  iframe{width:100%;height:100%;border:0;display:block;}
  .caption{
    position:absolute;left:0;right:0;bottom:0;background:rgba(20,26,36,.92);
    color:var(--txt);font-size:.85rem;padding:8px 16px;display:flex;
    justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .caption b{color:var(--accent);}
  .caption .close{cursor:pointer;color:var(--dim);border:0;background:none;font-size:.85rem;}

  /* mobile: swap buttons for a select */
  .picker{display:none;}
  @media (max-width:680px){
    .bar-nav .step{display:none;}
    .picker{
      display:block;flex:1;min-height:46px;font-size:1rem;padding:10px 12px;
      background:var(--bar-2);color:var(--txt);border:1px solid var(--line);border-radius:8px;
    }
    .hint{display:none;}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-top">
    <div class="title">Allen Gillon <span>· homepage options</span></div>
    <div class="hint">Use the buttons or your arrow keys. Tell me the number you like best.</div>
  </div>
  <div class="bar-nav">
    <select class="picker" id="picker" aria-label="Choose a design"></select>
    <button class="step" data-i="0"><span class="n">1</span>Small Press</button>
    <button class="step" data-i="1"><span class="n">2</span>The Desk</button>
    <button class="step" data-i="2"><span class="n">3</span>Programme</button>
    <button class="step" data-i="3"><span class="n">4</span>Script</button>
    <button class="step" data-i="4"><span class="n">5</span>Catalogue</button>
    <div class="arrows">
      <button class="arrow" id="prev" aria-label="Previous design">‹</button>
      <button class="arrow" id="next" aria-label="Next design">›</button>
    </div>
  </div>
</div>

<div class="stage">
  <iframe id="frame" title="Homepage preview" loading="eager"></iframe>
  <div class="caption">
    <span>Showing <b id="capName">1 · Small Press</b> of 5</span>
    <span id="capNote"></span>
  </div>
</div>

<script>
  var pages = [
    { file:"allengillon-smallpress.html", name:"Small Press", note:"Bold two-ink overprint. The warmest, most designed of the five." },
    { file:"allengillon-desk.html",       name:"The Desk",     note:"Tactile. His work laid out on a writing table." },
    { file:"allengillon-programme.html",  name:"Programme",    note:"The site as a theatre programme in three acts." },
    { file:"allengillon-script.html",     name:"Script",       note:"Set in the typography of a stage script." },
    { file:"allengillon-catalogue.html",  name:"Catalogue",    note:"Systematic library index. Most metadata-forward." }
  ];

  var frame = document.getElementById('frame');
  var steps = Array.prototype.slice.call(document.querySelectorAll('.step'));
  var picker = document.getElementById('picker');
  var capName = document.getElementById('capName');
  var capNote = document.getElementById('capNote');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var i = 0;

  pages.forEach(function(p, idx){
    var o = document.createElement('option');
    o.value = idx; o.textContent = (idx+1) + " · " + p.name;
    picker.appendChild(o);
  });

  function show(n){
    i = Math.max(0, Math.min(pages.length-1, n));
    frame.src = pages[i].file;
    capName.textContent = (i+1) + " · " + pages[i].name;
    capNote.textContent = pages[i].note;
    picker.value = i;
    steps.forEach(function(s){ s.setAttribute('aria-current', (+s.dataset.i===i)?'true':'false'); });
    prev.disabled = (i===0); next.disabled = (i===pages.length-1);
    if (history.replaceState) history.replaceState(null,"","#"+(i+1));
  }

  steps.forEach(function(s){ s.addEventListener('click', function(){ show(+s.dataset.i); }); });
  picker.addEventListener('change', function(){ show(+picker.value); });
  prev.addEventListener('click', function(){ show(i-1); });
  next.addEventListener('click', function(){ show(i+1); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight') show(i+1);
    if(e.key==='ArrowLeft') show(i-1);
  });

  var start = parseInt((location.hash||"").replace('#',''),10);
  show(isNaN(start) ? 0 : start-1);
</script>
</body>
</html>
